; PlatformIO Project Configuration File — Teensy Capteur (sensor board)
;
; Runs the EKF, reads the optical odometry sensor and the IMU, and answers the
; Teensy Moteur over Serial4.
;
; No "com" symlink here on purpose: this board has no USB protocol. The Teensy
; Moteur is the only one that talks to the Raspberry Pi. The 2026 prototype
; declared that dependency and never used it.
;
; https://docs.platformio.org/page/projectconf.html

; A bare `pio run` (and the IDE Build button) must only build the firmware. The
; native environment exists for `pio test` alone, see below.
[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include

lib_deps =
    #adafruit/Adafruit BNO08x @ ^1.2.5 ; IMU BNO085
    #sparkfun/SparkFun Qwiic OTOS Arduino Library @ ^1.1.0 ; Capteur optique odometrique (I2C)

upload_protocol = teensy-gui

; Host build of the Arduino-free libraries, so the link codec and the filter
; algebra are testable without a board. Both lib/teensy_link and lib/kalman must
; stay free of any Arduino include for this environment to keep working.
;
;     pio test -e native
;
; This environment is for `pio test`, NOT for `pio run`. Tests do not compile
; src/ (test_build_src defaults to no), so main.cpp and its Arduino.h are out of
; the way; `pio run -e native` would try to build them and fail.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_compat_mode = off
lib_deps =
