    ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A bare `pio run` (and the IDE Build button) must only build the firmware. The
; native environment exists for `pio test` alone, see below.
[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
; Writes fw_version.h (git describe, build date) for LOG_FW_INFO.
extra_scripts = pre:scripts/fw_version.py

lib_deps =
    com=symlink://../../common/usb_com/cpp
    adafruit/Adafruit BNO08x @ ^1.2.5 ; IMU BNO080
    sparkfun/SparkFun Qwiic OTOS Arduino Library @ ^1.1.0 ; Capteur optique odométrique (I2C)


upload_protocol = teensy-gui

; On the board, `pio test` runs the EKF timing suite and nothing else. The
; other suites test algorithms and run on the host.
;
;     pio test -e teensy41      (board plugged in)
test_filter = test_ekf_timing

; The match firmware on a Teensy alone, without drivers: the encoder counts are
; generated from the wheel commands instead of read over RS485 (a read without
; drivers waits 50 ms per wheel). Everything else is the real path: estimator,
; PIDs, telemetry, USB link. For the logging tests on a desk.
;
;     pio run -e teensy41_synthetic -t upload
[env:teensy41_synthetic]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -D SYNTHETIC_ENCODERS

; Host build of the Arduino-free libraries (lib/kalman, lib/pose_estimator,
; lib/kinematics, lib/motion, lib/log_ring), so that they are testable without
; a board. They must stay free of any Arduino include for this environment to
; keep working.
;
;     pio test -e native
;
; This environment is for `pio test`, NOT for `pio run`. Tests do not compile
; src/ (test_build_src defaults to no), so main.cpp and its Arduino.h are out of
; the way; `pio run -e native` would try to build them and fail.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_compat_mode = off
lib_deps =
; Needs Arduino.h and the MCU cycle counter: board only.
test_ignore = test_ekf_timing
