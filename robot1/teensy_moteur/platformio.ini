    ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include

; src/ now holds two firmwares: main.cpp (the existing bench) and link_bench.cpp
; (the inter-Teensy link bench). Each environment must pick exactly one, or the
; link step fails on a duplicate main().
build_src_filter = +<*> -<link_bench.cpp>

lib_deps =
    com=symlink://../../common/usb_com/cpp
    adafruit/Adafruit BNO08x @ ^1.2.5 ; IMU BNO080
    sparkfun/SparkFun Qwiic OTOS Arduino Library @ ^1.1.0 ; Capteur optique odométrique (I2C)
    
    
upload_protocol = teensy-gui

; Inter-Teensy link bench. Flash this on the Teensy Moteur and the
; teensy_capteur firmware on the other board, cross Serial4 (RX 16 / TX 17) and
; share ground. Reports RTT, pose age, lost frames and CRC errors.
;
;     pio run -e link_bench -t upload
;
; It reads no encoder: the counts are synthetic so the bench runs with two bare
; Teensys. See src/link_bench.cpp.
[env:link_bench]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
build_src_filter = -<*> +<link_bench.cpp>

; teensy_link is defined once, in the sensor board's lib/, and referenced from
; here. It must never be copied: the 2026 prototype defined its frames by hand on
; each side, which is how it ended up with three contradictory wiring comments.
lib_extra_dirs = ../teensy_capteur/lib

upload_protocol = teensy-gui
